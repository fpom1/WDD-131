<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event TIcekt</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="event.css" />
    <script src="event.js" defer></script>
</head>

<body>
    <main class="wrapper">
        <h1>Event Ticket</h1>

        <form id="MyForm">
            <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" required />
            </div>

            <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" required />
            </div>

            <div class="field full">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required />
            </div>

            <div class="field">
                <label for="guestType">Type</label>
                <select id="guestType" name="guestType" aria-controls="notesContainer" required>
                    <option value="">Choose one</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>
                </select>
            </div>

            <div class="field">
                <label for="availableDate">Event Date</label>
                <input id="availableDate" name="availableDate" type="date" required />
            </div>

            <div id="studentIdContainer" class="field full" hidden>
                <label for="studentId">Student ID (9 digits)</label>
                <input id="studentId" name="studentId" type="text" inputmode="numeric" pattern="[0-9]{9}" maxlength="9"
                    minlength="9" placeholder="Enter your 9-digit student ID" />
            </div>

            <div id="guestCodeContainer" class="field full" hidden>
                <label for="guestCode">Guest Code</label>
                <input id="guestCode" name="guestCode" type="text" pattern="EVENT131"
                    placeholder="Enter guest code" required />
            </div>

            <div id="notesContainer" class="field full" hidden>
                <label for="notes">Travel Notes</label>
                <input id="notes" name="notes" type="text" />
            </div>


            <button class="full" type="submit">Submit Preferences</button>
        </form>

        <section id="output" aria-live="polite"></section>
    </main>
</body>

</html>
