<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Exercise</title>
    <link rel="stylesheet" href="prove.css" />
</head>

<body>
    <header>
        <div class="header-title">
            <img src="images/recipe-book.png" class="hero" alt="Recipe book">
            <h1>Recipe Book</h1>
        </div>

        <form id="search" class="search-form">
            <input type="text" id="search" name="search" placeholder="Find a recipe"
                aria-label="Search through site content" required />
            <button type="submit" class="search-button">
                <img src="images/search.svg" alt="Search">
            </button>
        </form>
    </header>

    <hr>

    <main>

        <div class="gallery">

            <section class="media-card">
                <div class="media-card-image">
                    <img src="images/apple-crisp.jpg" alt="Apple crisp and ice cream">
                </div>
                <div class="media-card-content">
                    <button class="food-type-button">dessert</button>
                    <h3>Apple Crisp</h3>
                    <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                    </span>
                    <p>This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with
                        vanilla ice cream.</p>

                </div>
                <div class="meta-content">
                    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
                    <meta property="og:type" content="website">
                    <meta property="og:title" content="Your Title">
                    <meta property="og:description" content="Your Description">
                    <meta property="og:url" content="Your URL">
                    <meta property="og:image" content="social-preview-image.png">

                    <!-- X Card -->
                    <meta name="twitter:card" content="Social Preview Image">
                    <meta name="twitter:title" content="Your Title">
                    <meta name="twitter:description" content="Your Description">
                    <meta name="twitter:image" content="social-preview-image.png">

                    <!-- One favicon (ICO works everywhere) -->
                    <link rel="icon" href="/favicon.ico">

                    <!-- One Apple Touch Icon (iOS home screen) -->
                    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                </div>
            </section>

        </div>

    </main>

    <footer>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>

        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik -
            Flaticon</a>
    </footer>
</body>


</html>
